name: Validate extension catalog

on:
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "rules/**"
      - "schema/**"
      - "templates/**"
      - "tools/**"
      - "docs/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    paths:
      - "catalog.json"
      - "rules/**"
      - "schema/**"
      - "templates/**"
      - "tools/**"
      - "docs/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate-catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate v2 catalog and rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run catalog validator tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate extension catalog v2
        run: python tools/validate_catalog.py catalog.json
      - name: Validate signed rules
        run: python tools/validate_rules.py
